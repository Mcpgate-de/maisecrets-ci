# c1-a-reserved-word-after-a-secret-label-is-no-value: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c1-a-reserved-word-after-a-secret-label-is-no-value"
control = "C1"
statement = "A reserved word of a programming language or of SQL that a person would not choose as a password (rules/words/passwords/reserved-words.txt), as the whole unquoted value after a secret label and as code writes it (const secret = readonly;), is no secret for any rule (#29)."
runner = ["tests/test_reserved_words.py::ScanTests::test_an_unquoted_listed_word_gives_no_hit", "tests/test_detect_rules.py::LabelValueTests::test_a_reserved_word_after_a_secret_label_is_not_a_value"]

[proof]
file = "maisecrets/detection/value_checks.py"
find = '''    return rule.id in RESERVED_WORD_RULES and unquoted_reserved_word(text, start, secret)'''
replace = '''    return False'''
