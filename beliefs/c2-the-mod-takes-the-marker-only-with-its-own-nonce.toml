# c2-the-mod-takes-the-marker-only-with-its-own-nonce: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c2-the-mod-takes-the-marker-only-with-its-own-nonce"
control = "C2"
serves = ["M1.2"]
statement = "The mod accepts the marker of the tool-result hook only as the last line of an entry and only with the nonce of its own process: a marker text that a tool printed or another plugin's hook copied counts as no marker."
runner = ["tests/mod.test.ts::scenario A: a copied marker text in another entry, or one with another nonce, counts as no marker"]

[proof]
file = "claude-mod/maisecrets-mod.mjs"
find = "const MARK_RE = new RegExp(`^\\\\[maisecrets: result (checked|masked) ${NET_NONCE}(?: ([0-9a-f]{16}))?` +\n"
replace = "const MARK_RE = new RegExp(`^\\\\[maisecrets: result (checked|masked) [0-9a-f]{32}(?: ([0-9a-f]{16}))?` +\n"
