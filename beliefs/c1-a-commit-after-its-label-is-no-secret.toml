# c1-a-commit-after-its-label-is-no-secret: an invariant belief. Each mutation must turn at least one owning test red, and each owning test must be red under at least one mutation.
belief = "c1-a-commit-after-its-label-is-no-secret"
kind = "invariant"
control = "C1"
statement = "A hex value of 7 to 64 characters after a label whose last word names a revision and whose words name no credential (MAISECRETS_COMMIT, imageDigest) is a commit, a digest or a checksum, so the derived-label filter drops it; SECRET_SHA, key_rev, MYSECRET_SHA and passwordhash_revision stay labels of a credential: a part of a credential word in the label, glued or not, keeps the hit."
runner = ["tests/test_api_answer_fields.py::RevisionTests::test_a_revision_after_its_label_is_no_secret", "tests/test_api_answer_fields.py::RevisionTests::test_the_revision_check_reads_the_value", "tests/test_api_answer_fields.py::RevisionTests::test_a_label_with_a_credential_word_stays_a_credential", "tests/test_api_answer_fields.py::RevisionTests::test_a_hashicorp_password_under_a_revision_label_stays_a_hit"]

[[proof]]
path = "the check holds for no label"
file = "maisecrets/detection/fields.py"
find = '''    return (len(words) >= 2 and words[-1] in _REVISION_END and not any(c in rest for c in _CREDENTIAL_PARTS)'''
replace = '''    return (False and not any(c in rest for c in _CREDENTIAL_PARTS)'''

[[proof]]
path = "a credential word in the label no longer keeps the hit"
file = "maisecrets/detection/fields.py"
find = '''words[-1] in _REVISION_END and not any(c in rest for c in _CREDENTIAL_PARTS)'''
replace = '''words[-1] in _REVISION_END'''
