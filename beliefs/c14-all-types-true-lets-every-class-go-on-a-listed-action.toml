# c14-all-types-true-lets-every-class-go-on-a-listed-action: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c14-all-types-true-lets-every-class-go-on-a-listed-action"
control = "C14"
serves = ["M3.8"]
statement = '''With `all_types` true, every class (a secret and an own rule's value too) goes as a deposit into any string value of a listed tool and action.'''
runner = ["tests/test_deposit.py::AnyFieldTests::test_all_types_lets_every_class_go_on_a_listed_action"]

[proof]
file = "maisecrets/deposit.py"
find = '''            "all_types": raw.get("all_types") is True}'''
replace = '''            "all_types": False}'''
