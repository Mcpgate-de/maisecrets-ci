# c19-an-mcp-task-result-passes-only-with-its-moved-call: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c19-an-mcp-task-result-passes-only-with-its-moved-call"
control = "C19"
serves = ["M1.7"]
statement = "The result of an MCP task enters with placeholders only when this session's transcript has the tool result that moved an MCP call of that server and tool to the background as that task; another id is left to the prompt hook."
runner = ["tests/test_mcp_task_results.py::ModTests::test_a_notification_that_proves_nothing_is_left_to_the_hook", "tests/test_mcp_task_results.py::ProofTests::test_a_task_id_the_transcript_did_not_move_proves_nothing"]

[proof]
file = "maisecrets/agent_reports.py"
find = "    return found if all(_moved_call(transcript, t, n) for t, n in found) else None\n"
replace = "    return found\n"
