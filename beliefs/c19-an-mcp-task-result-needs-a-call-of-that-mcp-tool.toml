# c19-an-mcp-task-result-needs-a-call-of-that-mcp-tool: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c19-an-mcp-task-result-needs-a-call-of-that-mcp-tool"
control = "C19"
serves = ["M1.7"]
statement = "The tool result that moved a task proves an MCP task only when it answers a call of the MCP tool the summary names; the same sentence in the output of a Bash call or of another MCP tool proves nothing."
runner = ["tests/test_mcp_task_results.py::ProofTests::test_a_tool_result_of_another_tool_proves_nothing", "tests/test_mcp_task_results.py::ProofTests::test_a_call_of_another_mcp_tool_proves_nothing"]

[proof]
file = "maisecrets/agent_reports.py"
find = "    return any(_tool_input(transcript, c, tuple(names)) is not None for c in calls)\n"
replace = "    return bool(calls)\n"
