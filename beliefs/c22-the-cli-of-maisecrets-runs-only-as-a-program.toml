# c22-the-cli-of-maisecrets-runs-only-as-a-program: the test owns the rule; this file names it and the mutation that must turn it red.
belief = "c22-the-cli-of-maisecrets-runs-only-as-a-program"
control = "C22"
serves = ["M4.2"]
statement = '''The CLI of maisecrets runs as a program (python3 -m maisecrets.cli), as the launchers run it, but an import of it is refused: imported, it hands over its Vault (Gate A of #98).'''
runner = ["tests/test_runs_maisecrets_code.py::RunsMaisecretsCodeTests::test_python_code_in_the_command_that_imports_maisecrets_is_refused"]

[proof]
file = "maisecrets/shell_commands.py"
find = '''                          "rule_filter", "registry", "rulespec"})'''
replace = '''                          "rule_filter", "registry", "rulespec", "cli"})'''
