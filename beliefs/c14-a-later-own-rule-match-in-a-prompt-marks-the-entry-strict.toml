belief = "c14-a-later-own-rule-match-in-a-prompt-marks-the-entry-strict"
control = "C14"
serves = ["M3.8"]
statement = '''When an own rule or an import finds a value through Vault.put after a built-in rule stored it, the entry is marked strict and goes only to a target's path.'''
runner = ["tests/test_deposit.py::AnyFieldTests::test_a_later_own_rule_match_marks_a_stored_entry_strict"]

