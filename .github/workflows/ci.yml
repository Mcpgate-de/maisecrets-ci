# Cross-platform CI on the GitHub mirror. GitLab (netcup runner) stays the primary CI
# for Linux; GitHub is the only place we have Windows and macOS runners for free.
name: ci
on:
  push:
    # ci: the tested commit of a release, before the release commit reaches main. ci-check: a commit a maintainer
    # wants on Windows and macOS before a merge in GitLab (one branch, pushed over; no draft pull request, whose
    # deleted branch GitHub keeps listing). ci-mr/<iid>-<sha12>: the commit of a GitLab merge request, pushed by
    # its pipeline to the separate CI repository (scripts/github_matrix.py mr); one branch per commit, so each
    # has its own concurrency group and no push needs force
    # Not main: the mirror pushes main after the merge request ran this matrix (on a merge without a release
    # nothing waited for that run), and the release commit skips its jobs anyway
    branches: [ci, ci-check, "ci-mr/**"]
  pull_request:
# a newer push to the same ref makes the older run worthless: it is cancelled, not finished
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# the tests only read the checkout; a pushed branch of the CI repository brings its own copy of this file
permissions:
  contents: read
jobs:
  tests:
    # the release commit only bumps manifests and the changelog; its content was tested one
    # commit earlier, and the GitLab release job waits for this matrix on that commit
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    strategy:
      # both platforms run to the end: a red run must name every failure at once. With fail-fast the
      # 0.6.22 release needed three rounds of about 45 minutes for three Windows-only test failures.
      # Linux runs on GitLab (unit on 3.12 and 3.9, the harness, the native file store), so GitHub
      # keeps the two platforms GitLab does not have.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # a hung run turned the GitLab job windows_macos into a wait without end (9d7a40fb, 2026-10-19: Windows unit tests
    # past 29 minutes; a normal run takes 12 to 15). Twice the slowest normal run, then red.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: plugin lint
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3
          python scripts/lint_plugin.py
      - name: hook launcher through bash (Git Bash on Windows)
        shell: bash
        run: |
          echo '{"prompt":"say hi","session_id":"s","transcript_path":""}' | bash hooks/run.sh user-prompt
          # the token is assembled at run time so the repo scan never sees a secret shape
          T="glpat-""CiRunAbc123Def456Ghi7"
          echo "{\"prompt\":\"token $T\",\"session_id\":\"s\",\"transcript_path\":\"\"}" | bash hooks/run.sh user-prompt | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('decision')=='block', d; print('blocked ok')"
      - name: hook launcher through cmd.exe (Codex on Windows, commandWindows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -c "import json,sys; T='glpat-'+'CiRunAbc123Def456Ghi7'; open('payload.json','wb').write(json.dumps({'prompt':'\u00dcbergabe token '+T,'session_id':'s','transcript_path':''},ensure_ascii=False).encode('utf-8'))"
          python -c "import json,sys; open('plain.json','wb').write(json.dumps({'prompt':'say hi','session_id':'s','transcript_path':''}).encode())"
          rem the exact form Codex uses: cmd.exe /C "<commandWindows with the plugin root substituted>"
          type payload.json | cmd.exe /C ""%CD%/hooks/run.cmd" user-prompt" > out.json
          python -c "import json; d=json.load(open('out.json',encoding='utf-8')); assert d.get('decision')=='block', d; s=json.dumps(d,ensure_ascii=False); assert '\ufffd' not in s and '\u00c3' not in s, d; print('cmd launcher: blocked ok')"
          type plain.json | cmd.exe /C ""%CD%/hooks/run.cmd" user-prompt" > plain.out
          python -c "import json; d=json.load(open('plain.out',encoding='utf-8')); assert d.get('decision')!='block', d; print('cmd launcher: plain prompt passes')"
      # after the launcher checks (seconds). The wrapper runs `python -m unittest discover -s tests -v` and
      # writes each failing test as an annotation: the public API serves annotations without a token, the job log
      # needs one, and the GitLab merge request job prints them (scripts/github_matrix.py)
      - name: unit tests
        run: python scripts/github_matrix.py unit
      - name: platform clipboard (a placeholder and non-ASCII text round-trip)
        if: runner.os != 'Linux'
        env:
          MAISECRETS_NATIVE_CLIPBOARD_TEST: "1"
        run: python -m unittest tests.test_platform_clipboard -v
      - name: platform backend
        env:
          MAISECRETS_NATIVE_BACKEND_TEST: "1"
        run: python -m unittest tests.test_platform_backend -v
