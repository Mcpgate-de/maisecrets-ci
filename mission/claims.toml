# The promises README.md and PRIVACY.md make to users, each mapped to the mission that keeps it (kind "promise"),
# to the mission whose `ends` names it (kind "limit"), or to none (kind "feature": a function, not a protection).
# scripts/mission_coverage.py checks that each quote still stands in its source, and that every bullet of the
# README sections in GATED_SECTIONS starts with the quote of a claim: a new or reworded promise turns the check
# red until someone maps it here.

