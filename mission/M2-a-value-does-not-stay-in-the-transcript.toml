# M2: a product promise. See M1 for what checks it.
mission = "M2"
promise = "A value that a blocked prompt or a tool result carried does not stay in the session transcript on disk."
actors = ["A1", "A4"]
controls = ["C3"]
invariants = ["I4"]
ends = "A transcript of a client maisecrets does not scrub; a record written after the scrub window."

[[part]]
says = "A detected value is masked in the transcript in every record shape the clients write."
beliefs = ["c3-*", "inv-every-detected-value-can-be-scrubbed"]

[measure]
none = "the scrub is all or nothing per record shape; invariant I4 checks every detected value in every shape"
