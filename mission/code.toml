# The program files of the plugin, each with the controls (C*) and invariants (I*) of docs/THREAT-MODEL.md that its code
# carries, or `none` and the reason. The other direction of the mission layer: mission/M*.toml goes from a promise down
# to the beliefs; this register goes from the code up. scripts/mission_coverage.py --strict is red on a program file
# without an entry, an entry of a file that is gone, a declared control that no belief's proof in that file names, a
# proof that breaks a line of a file whose entry does not declare the proof's control (an injection proof, whose replace
# keeps the find text, breaks no line and is no such proof), and a file that the threat model names for a control that
# is missing or not declared for it.
#
# A file carries a control when a line of it keeps a rule of that control's row: a wrong line breaks the rule. A file
# that only routes, shows, measures or serves a command line with no such rule says `none`. The unit is the file, the
# unit of a proof and of the threat model: a move of code to a new file (as the move of C31's core to sref_hooks.py
# in 0.9.x) is red until the new file is declared and proven. Its limit: one proof per control and file is enough, so
# a second rule of the same control in the same file can stay unproven; the beliefs of that control name the rules.
#
# Program files: maisecrets/**/*.py, hooks/*.py, hooks/*.sh, hooks/*.cmd, claude-mod/*.mjs,
# skills/*/scripts/*.py (CODE in scripts/mission_touch.py). Data files (rules, word lists, hooks.json) and the
# command texts (commands/*.md) are no program files; a belief names them directly.
#
# `none` is a judgement that --strict cannot read. It catches two signs of a wrong one: a `none` file that a belief's
# mutation breaks (a belief of a control, an invariant or a label; an injection proof breaks no line), and a `none`
# file that names a hook answer key (decision, permissionDecision, updatedInput, updatedToolOutput,
# updatedMCPToolOutput, suppressOriginalPrompt, additionalContext, systemMessage, continue, stopReason, quoted or bare
# before : or =) or a hook's exit 2. It reads the text only: a key built at run time escapes it.
# A belief with serves = [] proves no control of its file.

[file]
"claude-mod/maisecrets-mod.mjs" = { controls = ["C1", "C31", "C32", "C33", "I5"] }
"hooks/dispatch.py" = { controls = ["C1", "C2", "C13", "C22", "C27"] }
"hooks/guard.py" = { controls = ["C13", "C33"] }
"hooks/ms.sh" = { none = "the fixed path of the person's /ms shortcut: it runs `pending` (send the last blocked prompt) of the highest maisecrets version installed from any marketplace or synced folder; the prompt hook checks that prompt again" }
"hooks/proxy_connect.py" = { controls = ["C18"] }
"hooks/resolve.py" = { none = "the Windows (Git Bash) launcher of the one-time read of a value: it starts the CLI's resolve command, whose grant Vault.redeem checks (maisecrets/vault.py)" }
# limit: run.cmd does not run on macOS or Linux; its C13 belief reads the file (each hook event's refusal, exit 0),
# so it proves the text of the launcher, not what cmd.exe does with it. The Windows runner of the windows_macos job
# starts run.cmd with a Python (.github/workflows/ci.yml); its branch without a Python runs on no machine of the CI.
"hooks/run.cmd" = { controls = ["C13"] }
